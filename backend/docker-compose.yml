version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncline
      POSTGRES_PASSWORD: syncline
      POSTGRES_DB: syncline
    ports:
      - "5432:5432"
    volumes:
      - syncline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncline"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://syncline:syncline@db:5432/syncline
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  syncline_pgdata:
